spring.datasource.url=${PHARMACY_DB_URL:jdbc:postgresql://localhost:5433/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.branch-name=Nha Thuoc So 1
app.hotline=1900xxxx
pharmacy.vat-rate=0.08
warehouse-service.url=${WAREHOUSE_SERVICE_URL:http://localhost:8091}
billing-service.url=${BILLING_SERVICE_URL:http://localhost:8092}
insurance-service.url=${INSURANCE_SERVICE_URL:http://localhost:8093}
resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
resilience4j.retry.instances.invoiceRetry.max-attempts=3
resilience4j.retry.instances.invoiceRetry.wait-duration=2s
resilience4j.retry.instances.invoiceRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.ratelimiter.instances.invoiceLimit.limit-for-period=5
resilience4j.ratelimiter.instances.invoiceLimit.limit-refresh-period=10s
resilience4j.ratelimiter.instances.invoiceLimit.timeout-duration=0
pharmacy.insurance.timeout=3s
resilience4j.timelimiter.instances.insuranceTimeout.timeout-duration=3s
resilience4j.timelimiter.instances.insuranceTimeout.cancel-running-future=true
resilience4j.retry.instances.insuranceRetry.max-attempts=3
resilience4j.retry.instances.insuranceRetry.wait-duration=2s
resilience4j.retry.instances.insuranceRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.insuranceCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.insuranceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.insuranceCB.wait-duration-in-open-state=20s
pharmacy.insurance.discount-rate=0.10

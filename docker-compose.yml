services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PHARMACY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pharmacy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmacy_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pharmacy_postgres_data:
